# ==============================================================================
# DealFlow360 Infrastructure Compose Specification
# An Intelligent, Self-Governing Sales Operations Platform
# ==============================================================================

name: dealflow360

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dealflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dealflow_db}
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - dealflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dealflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Redis Cache & Queue Service (BullMQ)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: dealflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dealflow-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: dealflow_postgres_data
    driver: local
  redis_data:
    name: dealflow_redis_data
    driver: local

# ------------------------------------------------------------------------------
# Isolated Application Network
# ------------------------------------------------------------------------------
networks:
  dealflow-network:
    name: dealflow_network
    driver: bridge
